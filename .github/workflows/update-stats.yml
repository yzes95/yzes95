name: Update GitHub Stats & Analytics

on:
  schedule:
    - cron: '0 0 * * 0' # Runs every Sunday at midnight
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download authentic stats & top languages SVGs
        run: |
          curl -s "https://github-readme-stats-fast.vercel.app/api?username=yzes95&show_icons=true&theme=radical&include_all_commits=true&count_private=true" -o stats.svg
          curl -s "https://github-readme-stats-fast.vercel.app/api/top-langs/?username=yzes95&layout=compact&theme=radical" -o langs.svg

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: Auto-update GitHub stats & analytics SVGs"
          file_pattern: "stats.svg langs.svg"
